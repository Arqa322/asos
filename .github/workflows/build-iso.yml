name: Build ASOS ISO

on:
  push:
    branches: ["claude/**", "main"]
    paths: ["archiso/**", "scripts/**", "vm/**", "build.sh", ".github/workflows/**"]
    tags: ["v*"]
  pull_request:
    paths: ["archiso/**", "scripts/**", "vm/**", "build.sh", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Fast sanity check (~1 min): every package exists, dependencies resolve,
  # no package/file conflicts, AUR packages build from official deps.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in build.sh scripts/*.sh vm/*.sh archiso/airootfs/usr/local/bin/*; do bash -n "$f"; done
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $t = $null; $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/vm/create-vm.ps1", [ref]$t, [ref]$e)
          if ($e.Count) { $e | ForEach-Object { Write-Error ("{0}:{1} {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }; exit 1 }
      - name: Validate package lists against Arch repositories
        run: python3 scripts/check-packages.py
      - name: Validate hyprland.lua against the Hyprland version in Arch
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          python3 scripts/check-hyprland-config.py --lua lua5.4

  build:
    needs: check
    # the ISO is built only on demand (Run workflow) or for a release tag
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Build ISO in Arch Linux container
        run: ./build.sh --docker

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: asos-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 7

      # GitHub release assets are limited to 2 GiB per file -> split the ISO
      - name: Split ISO for release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        run: |
          cd out
          sudo chown -R "$(id -u):$(id -g)" .
          for iso in *.iso; do split -b 1900M -d -a 2 "$iso" "$iso.part"; done
          ls -lh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ASOS ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          body: |
            Собрать ISO из частей:
            - Linux/macOS: `f=$(ls asos-*.iso.sha256); iso=${f%.sha256}; cat "$iso".part* > "$iso" && sha256sum -c "$f"`
            - Windows (cmd): `copy /b asos-ВЕРСИЯ-x86_64.iso.part00 + asos-ВЕРСИЯ-x86_64.iso.part01 + ... asos-ВЕРСИЯ-x86_64.iso`
          files: |
            out/*.iso.part*
            out/*.sha256
