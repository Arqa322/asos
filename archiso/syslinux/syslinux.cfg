SERIAL 0 115200
UI vesamenu.c32
MENU TITLE ASOS — Arch Linux + Hyprland
MENU BACKGROUND splash.png
MENU RESOLUTION 640 480
MENU CLEAR
MENU ROWS 8
MENU MARGIN 8
MENU TABMSG Press [Tab] to edit options
MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #ff89b4fa #00000000 none
MENU COLOR sel          7;37;40 #ff1e1e2e #ff89b4fa std
MENU COLOR unsel        37;44   #ffcdd6f4 #00000000 none
MENU COLOR tabmsg       31;40   #ff6c7086 #00000000 none

DEFAULT asos
TIMEOUT 100

LABEL asos
MENU LABEL ASOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash

LABEL asos-ram
MENU LABEL ASOS Live, copy to RAM (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram

LABEL asos-safe
MENU LABEL ASOS Live, safe graphics: sway without 3D (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% asos.session=sway-software

LABEL asos-nomodeset
MENU LABEL ASOS Live, safe graphics / console only (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset asos.nogui

LABEL memtest
MENU LABEL Memtest86+
LINUX /boot/memtest86+/memtest

LABEL hdt
MENU LABEL Hardware Information (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32
