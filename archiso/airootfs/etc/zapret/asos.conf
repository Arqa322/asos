# ============================================================
#  ASOS zapret configuration  (managed by `asos-zapret`)
#  After editing run:  sudo asos-zapret restart
# ============================================================

# Flowseal strategy. List available ones: asos-zapret list
# Examples: general, general-alt, general-alt2 ... general-simple-fake, general-fake-tls-auto
STRATEGY="general"

# Game filter (Flowseal "Game Filter"): off | all | tcp | udp
# Extends desync to ports 1024-65535 for addresses from the ipset (see IPSET_MODE).
GAME_FILTER="all"
GAME_FILTER_TCP_RANGE="1024-65535"
GAME_FILTER_UDP_RANGE="1024-65535"

# Flowseal "IPSet Filter":
#   none   - ipset disabled (placeholder 203.0.113.113/32)
#   any    - ipset matches ANY address (aggressive, everything on filtered ports gets desync)
#   loaded - full Flowseal ipset (Cloudflare, Discord, game CDNs ...)
IPSET_MODE="loaded"

# Atom game pack: adds game launchers/services hostlist + ipset to the strategy (1 = on, 0 = off)
ATOM_PACK="1"

# NFQUEUE number used by nfqws
QNUM="200"

# Extra arguments appended to nfqws (advanced)
NFQWS_EXTRA=""
