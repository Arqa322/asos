#
# /etc/pacman.conf (ASOS)
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 8
Color
ILoveCandy
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
DownloadUser = alpm

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# multilib is required for Steam, Wine and 32-bit Vulkan/Mesa drivers (Atom game pack)
[multilib]
Include = /etc/pacman.d/mirrorlist
