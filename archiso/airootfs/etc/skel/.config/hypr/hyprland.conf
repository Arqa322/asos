# ============================================================
#  ASOS — Hyprland configuration
#  Wiki: https://wiki.hypr.land
#  Keys: SUPER+Enter terminal | SUPER+D launcher | SUPER+Q close
#        SUPER+E files | SUPER+Z zapret menu | SUPER+F1 cheat sheet
#        SUPER+A Arduino IDE | SUPER+Shift+A Arduino helper | SUPER+Shift+N NanoPi tools
# ============================================================

monitor = , preferred, auto, 1

# ---------- programs ----------
$terminal    = kitty
$fileManager = thunar
$menu        = wofi --show drun
$browser     = firefox

# ---------- autostart ----------
exec-once = waybar
exec-once = mako
exec-once = swaybg -c '#1e1e2e'
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = xdg-user-dirs-update
exec-once = asos-welcome

# ---------- environment ----------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ---------- look & feel ----------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.17
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 4, ease, popin 85%
    animation = border, 1, 8, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, ease, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

# ---------- input (US + RU, Alt+Shift switches layout) ----------
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ---------- key bindings ----------
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, D, exec, $menu
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, L, exec, hyprlock
bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod, Z, exec, kitty --title asos-zapret -e asos-zapret menu
bind = $mod, F1, exec, kitty --title asos-help -e less /usr/share/asos/HOTKEYS.txt
bind = $mod, O, exec, libreoffice
bind = $mod, A, exec, arduino-ide
bind = $mod SHIFT, A, exec, kitty --title asos-arduino -e asos-arduino menu
bind = $mod SHIFT, N, exec, kitty --title asos-nanopi -e asos-nanopi menu
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = , Print, exec, grim - | wl-copy && notify-send "Скриншот" "Скопирован в буфер обмена"
bind = $mod, Escape, exec, kitty --title btop -e btop

# focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, S, togglespecialworkspace, magic
bind = $mod ALT, S, movetoworkspace, special:magic
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# mouse move / resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# user overrides (not overwritten by updates)
source = ~/.config/hypr/user.conf
