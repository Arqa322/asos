# generated from theme/templates by scripts/make-theme.py — in the Huilo repository edit the template; on your computer edit this file freely (huilo-update keeps a .bak copy)
# Huilo lock screen (hyprlock). Colours: theme/palette.toml
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/state/huilo/wallpaper/current
    color = rgba(0b0d12ff)
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    brightness = 0.55
    vibrancy = 0.2
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(ece7dcff)
    font_size = 112
    font_family = Inter Light
    position = 0, 170
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date '+%A, %-d %B'
    color = rgba(b9bfccff)
    font_size = 20
    font_family = Inter
    position = 0, 70
    halign = center
    valign = center
}

# user
label {
    monitor =
    text = $USER
    color = rgba(f2a33aff)
    font_size = 15
    font_family = Inter SemiBold
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    rounding = 14
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(f2a33aee) rgba(ff6b4aee) 45deg
    inner_color = rgba(181c25e6)
    font_color = rgba(ece7dcff)
    check_color = rgba(ffc978ff)
    fail_color = rgba(f0566aff)
    capslock_color = rgba(7cc4d8ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##8a91a5">Пароль…</span>
    fail_text = <span foreground="##f0566a">Неверный пароль ($ATTEMPTS)</span>
    font_family = Inter
    position = 0, -90
    halign = center
    valign = center
}

# keyboard layout + hint
label {
    monitor =
    text = $LAYOUT  ·  Enter — войти
    color = rgba(8a91a5ff)
    font_size = 11
    font_family = Inter
    position = 0, 40
    halign = center
    valign = bottom
}
