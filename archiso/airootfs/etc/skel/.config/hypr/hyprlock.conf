background {
    path = ~/.local/state/asos/wallpaper/current
    color = rgba(1e1e2eff)
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(89b4faff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    placeholder_text = Пароль...
    position = 0, -40
    halign = center
    valign = center
}

label {
    text = $TIME
    font_size = 64
    color = rgba(cdd6f4ff)
    position = 0, 80
    halign = center
    valign = center
}
