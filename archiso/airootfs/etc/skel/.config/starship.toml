# ASOS prompt (starship) — Catppuccin Mocha, rounded powerline segments
"$schema" = "https://starship.rs/config-schema.json"

format = """
[](fg:blue)\
$os\
$username\
[](fg:blue bg:mauve)\
$directory\
[](fg:mauve bg:surface0)\
$git_branch\
$git_status\
[](fg:surface0 bg:surface1)\
$c\
$rust\
$golang\
$python\
$nodejs\
$lua\
$docker_context\
[](fg:surface1)\
$cmd_duration\
$line_break\
$character"""

add_newline = true
palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
overlay0 = "#6c7086"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "bg:blue fg:crust"
format = "[ $symbol]($style)"

[os.symbols]
Arch = "󰣇 "
Linux = " "

[username]
show_always = true
style_user = "bg:blue fg:crust bold"
style_root = "bg:red fg:crust bold"
format = "[$user ]($style)"

[directory]
style = "bg:mauve fg:crust"
read_only = " 󰌾"
read_only_style = "bg:mauve fg:red"
format = "[ $path]($style)[$read_only]($read_only_style)[ ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Документы" = "󰈙 "
"Загрузки" = " "
"Музыка" = "󰝚 "
"Изображения" = " "
"Arduino" = " "

[git_branch]
symbol = ""
style = "bg:surface0 fg:mauve"
format = "[ $symbol $branch]($style)"

[git_status]
style = "bg:surface0 fg:pink"
format = "[( $all_status$ahead_behind)]($style)[ ](bg:surface0)"

[c]
symbol = " "
style = "bg:surface1 fg:blue"
format = "[ $symbol($version)]($style)"

[rust]
symbol = " "
style = "bg:surface1 fg:peach"
format = "[ $symbol($version)]($style)"

[golang]
symbol = " "
style = "bg:surface1 fg:sapphire"
format = "[ $symbol($version)]($style)"

[python]
symbol = " "
style = "bg:surface1 fg:yellow"
format = "[ $symbol($version)( \\($virtualenv\\))]($style)"

[nodejs]
symbol = " "
style = "bg:surface1 fg:green"
format = "[ $symbol($version)]($style)"

[lua]
symbol = " "
style = "bg:surface1 fg:blue"
format = "[ $symbol($version)]($style)"

[docker_context]
symbol = " "
style = "bg:surface1 fg:sapphire"
format = "[ $symbol$context]($style)"

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = " [󱦟 $duration]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
