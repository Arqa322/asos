# Huilo kitty. Colours: colors.conf (generated from theme/palette.toml)
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
font_size         11.5
disable_ligatures never

window_padding_width     12 14
background_opacity       0.94
background_blur          1
dynamic_background_opacity yes
confirm_os_window_close  0
enable_audio_bell        no
visual_bell_duration     0.0
remember_window_size     no
initial_window_width     110c
initial_window_height    30c

cursor_shape             beam
cursor_beam_thickness    1.8
cursor_blink_interval    0.6
cursor_trail             3
cursor_trail_start_threshold 4
cursor_trail_decay       0.1 0.4

scrollback_lines         20000
url_style                curly
copy_on_select           clipboard
strip_trailing_spaces    smart

tab_bar_edge             top
tab_bar_style            separator
tab_separator            " "
tab_bar_min_tabs         2
tab_title_template       " {index} {title[:28]} "
tab_bar_margin_height    4 0

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

modify_font cell_height 108%
hide_window_decorations yes

include colors.conf
# your own settings (not overwritten by updates)
include user.conf
