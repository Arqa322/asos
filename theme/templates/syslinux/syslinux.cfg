SERIAL 0 115200
UI vesamenu.c32
MENU TITLE Huilo - Arch Linux + Hyprland
MENU BACKGROUND splash.png
MENU RESOLUTION 640 480
MENU CLEAR
# the photo is the background: the menu sits low (over the table) on dark,
# semi-transparent bars so it stays readable and the caption stays visible
MENU ROWS 9
MENU MARGIN 6
MENU VSHIFT 12
MENU TABMSGROW 27
MENU CMDLINEROW 27
MENU TIMEOUTROW 28
MENU HELPMSGROW 25
MENU TABMSG Press [Tab] to edit boot options
MENU COLOR screen       37;40   #00000000 #00000000 none
MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #ff@{snow.hex} #d8@{ink0.hex} std
MENU COLOR sel          7;37;40 #ff@{ink0.hex} #f0@{amber.hex} std
MENU COLOR hotsel       1;7;37;40 #ff@{ink0.hex} #f0@{amber.hex} std
MENU COLOR unsel        37;44   #ff@{snow.hex} #c8@{ink0.hex} std
MENU COLOR hotkey       1;37;44 #ff@{honey.hex} #c8@{ink0.hex} std
MENU COLOR tabmsg       31;40   #ff@{snow.hex} #c8@{ink0.hex} std
MENU COLOR timeout_msg  37;40   #ff@{snow.hex} #c8@{ink0.hex} std
MENU COLOR timeout      1;37;40 #ff@{amber.hex} #c8@{ink0.hex} std
MENU COLOR help         37;40   #ff@{snow.hex} #c8@{ink0.hex} std
MENU COLOR cmdline      37;40   #ff@{snow.hex} #c8@{ink0.hex} std
DEFAULT huilo
TIMEOUT 100

LABEL huilo
MENU LABEL Huilo Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash

LABEL huilo-ram
MENU LABEL Huilo Live, copy to RAM (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram

LABEL huilo-safe
MENU LABEL Huilo Live, safe graphics: sway without 3D (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% huilo.session=sway-software

LABEL huilo-nomodeset
MENU LABEL Huilo Live, safe graphics / console only (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset huilo.nogui

LABEL memtest
MENU LABEL Memtest86+
LINUX /boot/memtest86+/memtest

LABEL hdt
MENU LABEL Hardware Information (HDT)
COM32 hdt.c32
APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

LABEL reboot
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
MENU LABEL Power Off
COM32 poweroff.c32
