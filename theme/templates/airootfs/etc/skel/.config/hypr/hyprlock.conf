# Huilo lock screen (hyprlock). Colours: theme/palette.toml
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/state/huilo/wallpaper/current
    color = rgba(@{ink0.hex}ff)
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    brightness = 0.55
    vibrancy = 0.2
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(@{snow.hex}ff)
    font_size = 112
    font_family = @{font.ui} Light
    position = 0, 170
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date '+%A, %-d %B'
    color = rgba(@{fog.hex}ff)
    font_size = 20
    font_family = @{font.ui}
    position = 0, 70
    halign = center
    valign = center
}

# user
label {
    monitor =
    text = $USER
    color = rgba(@{amber.hex}ff)
    font_size = 15
    font_family = @{font.ui} SemiBold
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    rounding = 14
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(@{amber.hex}ee) rgba(@{ember.hex}ee) 45deg
    inner_color = rgba(@{ink2.hex}e6)
    font_color = rgba(@{snow.hex}ff)
    check_color = rgba(@{honey.hex}ff)
    fail_color = rgba(@{berry.hex}ff)
    capslock_color = rgba(@{glacier.hex}ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##@{mist.hex}">Пароль…</span>
    fail_text = <span foreground="##@{berry.hex}">Неверный пароль ($ATTEMPTS)</span>
    font_family = @{font.ui}
    position = 0, -90
    halign = center
    valign = center
}

# keyboard layout + hint
label {
    monitor =
    text = $LAYOUT  ·  Enter — войти
    color = rgba(@{mist.hex}ff)
    font_size = 11
    font_family = @{font.ui}
    position = 0, 40
    halign = center
    valign = bottom
}
